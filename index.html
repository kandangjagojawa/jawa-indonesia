<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transliterasi Aksara Jawa Bahasa Indonesia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Transliterasi Aksara Jawa Bahasa Indonesia</h1>

        <!-- Petunjuk Penulisan -->
        <div class="petunjuk-box">
            <h3>📌 Petunjuk Penulisan Vokal E:</h3>
            <ul>
                <li>Gunakan <strong>e</strong> untuk <em>e pepet</em> (contoh: emas, engkau, kerbau).</li>
                <li>Gunakan <strong>e'</strong>, <strong>é</strong>, atau <strong>è</strong> untuk <em>e taling</em> (contoh: ke'cap, e'nak, e'mbe'r, pe'nde'k).</li>
            </ul>
        </div>

        <!-- Area Input Latin -->
        <div class="input-section">
            <label for="inputLatin">Ketik Teks Latin / Bahasa Indonesia:</label>
            <textarea id="inputLatin" placeholder="Ketik kalimat di sini... (contoh: Saya sekolah di SMA Negeri 8 Yogyakarta dan makan kecap.)"></textarea>
        </div>

        <!-- Area Output Aksara Jawa -->
        <div class="output-section">
            <div class="output-header">
                <label>Hasil Aksara Jawa:</label>
                <button id="btnSalin" onclick="salinAksara()">📋 Salin Aksara</button>
            </div>
            <div id="outputJawa" class="box-aksara">-</div>
        </div>
    </div>

    <!-- Pemuatan Script -->
    <script src="jawaindo.js"></script>
    <script src="app.js"></script>
</body>
</html>
